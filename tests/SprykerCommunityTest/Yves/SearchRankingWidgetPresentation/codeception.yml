namespace: SprykerCommunityTest\Yves\SearchRankingWidgetPresentation

paths:
    tests: .
    data: _data
    support: _support
    output: _output

coverage:
    enabled: true
    remote: false
    include:
        - 'packages/spryker-community/search-ranking/src/*'

suites:
    Presentation:
        path: Presentation
        actor: SearchRankingWidgetPresentationTester
        modules:
            enabled:
                - Asserts
                - \PyzTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Config\Helper\ConfigInit
                - \SprykerTest\Shared\Testify\Helper\LocatorHelper:
                    projectNamespaces: ['Pyz']
                - WebDriver:
                    url: ''
                    browser: chrome
                    window_size: 1920x1080
                    # See the sibling Zed suite's codeception.yml (SearchRankingGuiPresentation) and the
                    # search-ranking-optimizer/search-debug packages' own Yves Presentation suites for why
                    # host/capabilities are set this way — same gotchas, confirmed live on all of them.
                    host: webdriver
                    restart: false
                    capabilities:
                        goog:chromeOptions:
                            args: ['--headless', '--disable-gpu', '--disable-dev-shm-usage', '--no-sandbox']
                - \SprykerTest\Shared\Application\Helper\YvesHelper
