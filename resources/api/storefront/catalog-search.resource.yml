resource:
    name: CatalogSearch

    # Additive merge into core's `catalog-search` resource (spryker/catalog-search-rest-api,
    # resources/api/storefront/catalog-search.resource.yml) — matched by `resource.name` above. Only
    # `name` and `properties` are set here on purpose: `shortName`/`provider`/`operations`/etc. are
    # scalar keys that would silently CLOBBER whichever layer has higher merge precedence rather than
    # merge, so only one place (a project-level resource.yml) should ever set them. See this package's
    # README, "Glue API" section, for the merge-precedence rule and the required project-level step.
    properties:
        randomImpact:
            type: array
            writable: false
            readable: true
            required: false
            description: >-
                Per-product ranking-position deltas the configured random tie-breaker metric causes on
                the CURRENT page only (not a full-corpus re-query). Present only when the requesting
                customer holds the SeeSearchRankingRandomImpactPermissionPlugin permission AND a ranking
                configuration is synchronized for the current (store, locale); absent (key omitted)
                otherwise. See SearchRankingConfig for the exact nested shape (isActive, deltas).
            openapiContext:
                example:
                    isActive: true
                    deltas:
                        201: 2
                        305: -1
